<svg width="680" height="900" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg">
<style>
@media (prefers-color-scheme: light) {
  .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; }
  .c-coral .ts { fill: #993C1D; }
  .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }
  .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }
  .c-gray rect, .c-gray circle, .c-gray ellipse { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
  .c-amber rect, .c-amber circle, .c-amber ellipse { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }
  .c-blue rect, .c-blue circle, .c-blue ellipse { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #0C447C; }
  .c-blue .ts { fill: #185FA5; }
  .c-green rect, .c-green circle, .c-green ellipse { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #27500A; }
  .c-green .ts { fill: #3B6D11; }
  .c-pink rect, .c-pink circle, .c-pink ellipse { fill: #FBEAF0; stroke: #993556; }
  .c-pink .th { fill: #72243E; }
  .c-pink .ts { fill: #993556; }
}
@media (prefers-color-scheme: dark) {
  .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #712B13; stroke: #F5C4B3; }
  .c-coral .th { fill: #F5C4B3; }
  .c-coral .ts { fill: #F0997B; }
  .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #0F6E56; stroke: #9FE1CB; }
  .c-teal .th { fill: #9FE1CB; }
  .c-teal .ts { fill: #5DCAA5; }
  .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #3C3489; stroke: #CECBF6; }
  .c-purple .th { fill: #CECBF6; }
  .c-purple .ts { fill: #AFA9EC; }
  .c-gray rect, .c-gray circle, .c-gray ellipse { fill: #444441; stroke: #D3D1C7; }
  .c-gray .th { fill: #D3D1C7; }
  .c-gray .ts { fill: #B4B2A9; }
  .c-amber rect, .c-amber circle, .c-amber ellipse { fill: #854F0B; stroke: #FAC775; }
  .c-amber .th { fill: #FAC775; }
  .c-amber .ts { fill: #EF9F27; }
  .c-blue rect, .c-blue circle, .c-blue ellipse { fill: #185FA5; stroke: #B5D4F4; }
  .c-blue .th { fill: #B5D4F4; }
  .c-blue .ts { fill: #85B7EB; }
  .c-green rect, .c-green circle, .c-green ellipse { fill: #3B6D11; stroke: #C0DD97; }
  .c-green .th { fill: #C0DD97; }
  .c-green .ts { fill: #97C459; }
  .c-pink rect, .c-pink circle, .c-pink ellipse { fill: #72243E; stroke: #F4C0D1; }
  .c-pink .th { fill: #F4C0D1; }
  .c-pink .ts { fill: #ED93B1; }
}
.th { font-family: sans-serif; font-size: 14px; font-weight: 500; }
.ts { font-family: sans-serif; font-size: 12px; font-weight: 400; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- DATOS ORIGINALES -->
<g class="c-coral">
<rect x="40" y="40" width="600" height="140" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="70" text-anchor="middle">Datos originales del Ministerio del Interior</text>
<text class="ts" x="340" y="90" text-anchor="middle">Balances trimestrales de criminalidad (2015-2025)</text>
</g>

<!-- Características de datos originales -->
<g class="c-coral">
<rect x="60" y="110" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="130" text-anchor="middle">Valores acumulados</text>
<text class="ts" x="145" y="148" text-anchor="middle">T2 incluye T1 + T2</text>
</g>

<g class="c-coral">
<rect x="255" y="110" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="130" text-anchor="middle">Nombres inconsistentes</text>
<text class="ts" x="340" y="148" text-anchor="middle">Múltiples variantes</text>
</g>

<g class="c-coral">
<rect x="450" y="110" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="130" text-anchor="middle">Sin población</text>
<text class="ts" x="535" y="148" text-anchor="middle">Solo cifras absolutas</text>
</g>

<!-- Flecha hacia procesamiento -->
<line x1="340" y1="180" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/>

<!-- FASE 1: LIMPIEZA -->
<g class="c-teal">
<rect x="40" y="220" width="600" height="100" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="250" text-anchor="middle">Fase 1: Limpieza y estandarización</text>
</g>

<g class="c-teal">
<rect x="60" y="270" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="145" y="294" text-anchor="middle">Unificar tipologías</text>
</g>

<g class="c-teal">
<rect x="255" y="270" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="294" text-anchor="middle">Normalizar geografías</text>
</g>

<g class="c-teal">
<rect x="450" y="270" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="535" y="294" text-anchor="middle">Eliminar duplicados</text>
</g>

<!-- Flecha hacia enriquecimiento -->
<line x1="340" y1="320" x2="340" y2="360" class="arr" marker-end="url(#arrow)"/>

<!-- FASE 2: ENRIQUECIMIENTO -->
<g class="c-purple">
<rect x="40" y="360" width="280" height="100" rx="12" stroke-width="0.5"/>
<text class="th" x="180" y="390" text-anchor="middle">Fase 2: Enriquecimiento</text>
<text class="ts" x="180" y="410" text-anchor="middle">Cruce con datos INE</text>
</g>

<g class="c-purple">
<rect x="60" y="430" width="240" height="20" rx="6" stroke-width="0.5"/>
<text class="ts" x="180" y="444" text-anchor="middle">Población por año y geografía</text>
</g>

<!-- Datos INE (entrada lateral) -->
<g class="c-gray">
<rect x="380" y="380" width="240" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="404" text-anchor="middle">Datos INE</text>
<text class="ts" x="500" y="424" text-anchor="middle">Población anual</text>
</g>

<!-- Flecha del INE al enriquecimiento -->
<path d="M380 410 L330 410" class="arr" marker-end="url(#arrow)" fill="none"/>

<!-- Flecha hacia cálculo trimestral -->
<line x1="180" y1="460" x2="180" y2="500" class="arr" marker-end="url(#arrow)"/>

<!-- FASE 3: DESAGREGACIÓN -->
<g class="c-amber">
<rect x="40" y="500" width="280" height="120" rx="12" stroke-width="0.5"/>
<text class="th" x="180" y="530" text-anchor="middle">Fase 3: Desagregación trimestral</text>
<text class="ts" x="180" y="550" text-anchor="middle">De acumulado a trimestral</text>
</g>

<g class="c-amber">
<rect x="60" y="570" width="240" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="180" y="586" text-anchor="middle">T2 delitos = (Ene-Jun) - (Ene-Mar)</text>
<text class="ts" x="180" y="600" text-anchor="middle">Resta valores acumulados</text>
</g>

<!-- Flecha hacia cálculo de tasa -->
<line x1="180" y1="620" x2="180" y2="660" class="arr" marker-end="url(#arrow)"/>

<!-- FASE 4: CÁLCULO TASA -->
<g class="c-blue">
<rect x="40" y="660" width="280" height="100" rx="12" stroke-width="0.5"/>
<text class="th" x="180" y="690" text-anchor="middle">Fase 4: Cálculo de tasa</text>
</g>

<g class="c-blue">
<rect x="60" y="720" width="240" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="180" y="739" text-anchor="middle">(Delitos / Población) × 1000</text>
</g>

<!-- Flecha hacia datos finales -->
<line x1="340" y1="710" x2="380" y2="710" class="arr" marker-end="url(#arrow)"/>

<!-- DATOS FINALES -->
<g class="c-green">
<rect x="380" y="500" width="260" height="260" rx="12" stroke-width="0.5"/>
<text class="th" x="510" y="530" text-anchor="middle">Datos procesados finales</text>
<text class="ts" x="510" y="550" text-anchor="middle">Base de datos PostgreSQL</text>
</g>

<g class="c-green">
<rect x="400" y="570" width="220" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="510" y="594" text-anchor="middle">Valores por trimestre individual</text>
</g>

<g class="c-green">
<rect x="400" y="620" width="220" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="510" y="644" text-anchor="middle">Tasa por 1000 habitantes</text>
</g>

<g class="c-green">
<rect x="400" y="670" width="220" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="510" y="694" text-anchor="middle">Tipologías estandarizadas</text>
</g>

<g class="c-green">
<rect x="400" y="720" width="220" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="510" y="739" text-anchor="middle">Geografías normalizadas</text>
</g>

<!-- Datos IGN (entrada lateral derecha) -->
<g class="c-pink">
<rect x="40" y="800" width="240" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="828" text-anchor="middle">Datos IGN</text>
<text class="ts" x="160" y="848" text-anchor="middle">Instituto Geográfico Nacional</text>
<text class="ts" x="160" y="865" text-anchor="middle">GeoParquet: CCAA, provincias,</text>
<text class="ts" x="160" y="878" text-anchor="middle">municipios</text>
</g>

<!-- Flecha del IGN a la app -->
<path d="M280 840 L380 840" class="arr" marker-end="url(#arrow)" fill="none"/>

<!-- APLICACIÓN WEB -->
<g class="c-gray">
<rect x="380" y="800" width="260" height="80" rx="12" stroke-width="0.5"/>
<text class="th" x="510" y="828" text-anchor="middle">Aplicación web</text>
<text class="ts" x="510" y="848" text-anchor="middle">FastAPI + PostgreSQL</text>
<text class="ts" x="510" y="865" text-anchor="middle">Leaflet.js para mapas interactivos</text>
</g>

<!-- Flecha de datos finales a la app -->
<line x1="510" y1="760" x2="510" y2="798" class="arr" marker-end="url(#arrow)"/>

</svg>